name: CI

on:
  push:
    branches: [main, feature/frontend-auth-dashboard]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and verification tools
        run: python -m pip install ".[dev]"
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format
        run: ruff format --check app tests

  typing:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and verification tools
        run: python -m pip install ".[dev]"
      - name: Mypy
        run: mypy app

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and verification tools
        run: python -m pip install ".[dev]"
      - name: Bandit
        run: bandit -c pyproject.toml -r app
      - name: Dependency audit
        run: pip-audit

  tests:
    name: Tests and migrations
    runs-on: ubuntu-latest
    env:
      SUPPORT_TEST_POSTGRES_URL: postgresql+psycopg://support:support@localhost:5432/support_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and verification tools
        run: python -m pip install ".[dev]"
      - name: Verify a single Alembic head
        run: |
          heads="$(alembic heads)"
          printf '%s\\n' "$heads"
          test "$(printf '%s\\n' "$heads" | grep -c '(head)')" -eq 1
      - name: Verify migrations from an empty PostgreSQL database
        env:
          SUPPORT_DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_migrations_test
          PGPASSWORD: support
        run: |
          createdb --host localhost --username support support_migrations_test
          alembic upgrade head
          alembic current
      - name: Run tests with coverage
        run: coverage run --source=app -m pytest -o addopts=""
      - name: Enforce coverage threshold
        run: coverage report --fail-under=80

  docker:
    name: Docker build
    needs: [lint, typing, security, tests]
    if: ${{ needs.lint.result == 'success' && needs.typing.result == 'success' && needs.security.result == 'success' && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag support-system:ci .
