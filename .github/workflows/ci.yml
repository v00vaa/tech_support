name: CI

on:
  push:
    branches: [main, feature/frontend-auth-dashboard]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SUPPORT_TEST_POSTGRES_URL: postgresql+psycopg://support:support@localhost:5432/support_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project and verification tools
        run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: bandit -c pyproject.toml -r app
      - run: pip-audit
      - run: pytest
