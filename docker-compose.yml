services:
  app:
    build: .
    volumes:
      - support_uploads:/service/instance/uploads
    environment:
      SUPPORT_ENVIRONMENT: development
      SUPPORT_SECRET_KEY: development-only-change-me
      SUPPORT_DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
      SUPPORT_RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      SUPPORT_PUBLIC_BASE_URL: http://localhost:5000
      SUPPORT_OLLAMA_BASE_URL: http://ollama:11434
      SUPPORT_OLLAMA_MODEL: ${SUPPORT_OLLAMA_MODEL:-qwen2.5:3b}
      SUPPORT_SMTP_HOST: ${SUPPORT_SMTP_HOST:-}
      SUPPORT_SMTP_PORT: ${SUPPORT_SMTP_PORT:-587}
      SUPPORT_SMTP_USERNAME: ${SUPPORT_SMTP_USERNAME:-}
      SUPPORT_SMTP_PASSWORD: ${SUPPORT_SMTP_PASSWORD:-}
      SUPPORT_SMTP_SENDER: ${SUPPORT_SMTP_SENDER:-}
      SUPPORT_SMTP_USE_TLS: ${SUPPORT_SMTP_USE_TLS:-true}
    ports:
      - "5000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command:
      - flask
      - --app
      - wsgi:app
      - run-auto-forward-worker
      - --interval
      - "30"
      - --batch-size
      - "100"
    environment:
      SUPPORT_ENVIRONMENT: development
      SUPPORT_SECRET_KEY: development-only-change-me
      SUPPORT_DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
      SUPPORT_RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      SUPPORT_OLLAMA_BASE_URL: http://ollama:11434
      SUPPORT_OLLAMA_MODEL: ${SUPPORT_OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      SUPPORT_ENVIRONMENT: development
      SUPPORT_SECRET_KEY: development-only-change-me
      SUPPORT_DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${SUPPORT_OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  support_uploads:
  postgres_data:
  pgadmin_data:
  ollama_data:
