services:
  app:
    build: .
    environment:
      SUPPORT_ENVIRONMENT: development
      SUPPORT_SECRET_KEY: development-only-change-me
      SUPPORT_DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
    ports:
      - "5000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      SUPPORT_ENVIRONMENT: development
      SUPPORT_SECRET_KEY: development-only-change-me
      SUPPORT_DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
