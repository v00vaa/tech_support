{% extends "layout.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>{{ client.name }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('clients.client_edit', client_id=client.id) }}">Изменить</a></div><div class="card"><div class="card-body"><dl class="row mb-0"><dt class="col-sm-3">Email</dt><dd class="col-sm-9">{{ client.email }}</dd><dt class="col-sm-3">Телефон</dt><dd class="col-sm-9">{{ client.phone or '—' }}</dd></dl></div></div><h2 class="h4 mt-4">Диалоги</h2><ul class="list-group">{% for dialog in client.dialogs %}<li class="list-group-item"><a href="{{ url_for('dialogs.dialog_detail', dialog_id=dialog.id) }}">#{{ dialog.id }} · {{ dialog.subject }}</a></li>{% else %}<li class="list-group-item text-muted">Диалогов нет.</li>{% endfor %}</ul>{% endblock %}
