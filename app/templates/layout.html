<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}Техническая поддержка{% endblock %}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/variables.css') }}"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/layout.css') }}"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/components.css') }}"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >
  {% block styles %}{% endblock %}
</head>
<body>
  {% include "components/_navbar.html" %}

  <main class="support-main">
    {% include "components/_flash.html" %}
    {% block content %}{% endblock %}
  </main>

  <footer class="support-footer">
    Support Desk Prototype · учебный проект
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
