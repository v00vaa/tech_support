{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="support-flash-stack" aria-live="polite" aria-atomic="false">
    {% for category, message in messages %}
    <div
      class="alert alert-{{ category }} alert-dismissible fade show"
      role="alert"
    >
      {{ message }}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Закрыть"
      ></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
